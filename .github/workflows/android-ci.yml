name: Android CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    name: Build, test, and verify debug APKs
    uses: ./.github/workflows/android-debug-build.yml
    with:
      artifact_name: stremio-mobile-debug-apks
      retention_days: 7
