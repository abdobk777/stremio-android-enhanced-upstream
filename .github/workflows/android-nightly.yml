name: Android Nightly APK

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-nightly-apk
  cancel-in-progress: true

jobs:
  debug-build:
    name: Build and verify nightly debug APKs
    uses: ./.github/workflows/android-debug-build.yml
    with:
      artifact_name: stremio-mobile-nightly-debug-apks
      retention_days: 14
