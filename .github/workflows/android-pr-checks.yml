name: Android PR Checks

on:
  pull_request:
  push:
    branches:
      - "work/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    name: Build, test, and verify debug APKs
    uses: ./.github/workflows/android-debug-build.yml
    with:
      artifact_name: stremio-android-enhanced-debug
      retention_days: 7
