name: Android PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    name: Build, test, and verify debug APKs
    uses: ./.github/workflows/android-debug-build.yml
    with:
      artifact_name: stremio-android-enhanced-debug
      retention_days: 7
