name: Android PR Checks

on:
  pull_request:
  push:
    branches:
      - "work/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Compile and Unit Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile, test, and assemble debug APK
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --warning-mode all

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: stremio-android-enhanced-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
